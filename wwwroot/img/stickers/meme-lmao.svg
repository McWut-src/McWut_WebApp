  <text x="50" y="82" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" fill="#111827" letter-spacing="1">LMAO</text>
  <path d="M84 13 Q84 18 89 18 Q84 18 84 23 Q84 18 79 18 Q84 18 84 13 Z" fill="#ec4899" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>

