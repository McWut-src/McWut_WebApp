  <path d="M70 34 L59 41 L70 48" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Big Laughing Grin -->
  <path d="M30 52 Q50 74 70 52 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="34" y1="58" x2="66" y2="58" stroke="#111827" stroke-width="2.5"/>
  <!-- Ribbon Banner Tails -->
  <polygon points="8,76 22,68 22,88 12,88 15,81" fill="#ec4899" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="92,76 78,68 78,88 88,88 85,81" fill="#ec4899" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
