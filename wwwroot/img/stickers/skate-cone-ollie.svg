<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- White die cut border -->
    <circle cx="50" cy="50" r="44" fill="#ffffff"/>
    <!-- Orange Road Cone on ground -->
    <polygon points="46,42 54,42 66,80 34,80" fill="#f97316" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <!-- White reflective stripe on cone -->
    <polygon points="43,56 57,56 61,68 39,68" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="28" y="78" width="44" height="6" rx="2" fill="#ea580c" stroke="#1e293b" stroke-width="3"/>
    <!-- Skateboard in air performing Ollie over cone -->
    <g transform="rotate(-20 50 28)">
      <rect x="24" y="24" width="52" height="7" rx="3.5" fill="#06b6d4" stroke="#1e293b" stroke-width="3"/>
      <circle cx="32" cy="33" r="3" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
      <circle cx="68" cy="33" r="3" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
    </g>
    <!-- Motion arc swoosh -->
    <path d="M22 60 Q34 20 64 22" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>
  </g>
</svg>
