<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 112">
  <style>
    .sticker-white-border {
      filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
              drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
              drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff)
              drop-shadow(2px -2px 0 #fff) drop-shadow(-2px 2px 0 #fff)
              drop-shadow(0 4px 6px rgba(0,0,0,.22));
    }
  </style>
  <g class="sticker-white-border">
    
  <!-- Tilted Dynamic Backing Splash -->
  <rect x="10" y="18" width="80" height="64" rx="14" transform="rotate(-6 50 50)" fill="#111827" stroke="#111827" stroke-width="4"/>
  <!-- 3D Extrude Shadow for 67 -->
  <text x="33" y="72" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#facc15" stroke="#111827" stroke-width="4" transform="rotate(-8 33 50)">6</text>
  <text x="69" y="72" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#facc15" stroke="#111827" stroke-width="4" transform="rotate(6 69 50)">7</text>
  <!-- Foreground 6 (Cyan) & 7 (Hot Pink) -->
  <text x="30" y="68" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#06b6d4" stroke="#111827" stroke-width="3.5" transform="rotate(-8 30 50)">6</text>
  <text x="66" y="68" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#ec4899" stroke="#111827" stroke-width="3.5" transform="rotate(6 66 50)">7</text>
  <!-- Up/Down Levitating Hand Arrows & Sparkles -->
  <path d="M16 12 Q16 18 22 18 Q16 18 16 24 Q16 18 10 18 Q16 18 16 12 Z" fill="#a3e635" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
  <path d="M86 17 Q86 22 91 22 Q86 22 86 27 Q86 22 81 22 Q86 22 86 17 Z" fill="#facc15" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
  <path d="M20 86 H42 M60 86 H82" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>
