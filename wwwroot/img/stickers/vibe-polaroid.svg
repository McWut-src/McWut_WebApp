<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- White die cut border -->
    <rect x="18" y="22" width="64" height="54" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="8"/>
    <rect x="34" y="60" width="32" height="34" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
    <!-- Photo Sliding Out Bottom -->
    <rect x="36" y="62" width="28" height="30" rx="2" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
    <rect x="39" y="65" width="22" height="18" fill="#38bdf8"/>
    <!-- Camera Body -->
    <rect x="20" y="24" width="60" height="48" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <!-- Rainbow Stripe -->
    <rect x="20" y="44" width="60" height="4" fill="#f43f5e"/>
    <rect x="20" y="48" width="60" height="4" fill="#facc15"/>
    <rect x="20" y="52" width="60" height="4" fill="#06b6d4"/>
    <!-- Big Camera Lens -->
    <circle cx="50" cy="48" r="16" fill="#0f172a" stroke="#ffffff" stroke-width="3"/>
    <circle cx="50" cy="48" r="9" fill="#0284c7"/>
    <circle cx="47" cy="45" r="3" fill="#ffffff"/>
    <!-- Flash Unit -->
    <rect x="26" y="30" width="14" height="10" rx="2" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
  </g>
</svg>
