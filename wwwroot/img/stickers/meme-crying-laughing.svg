    <path d="M26 44 C12 44 8 52 8 62 C8 70 16 72 20 66 C24 60 26 50 26 44 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M74 44 C88 44 92 52 92 62 C92 70 84 72 80 66 C76 60 74 50 74 44 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
  </g>
</svg>
