<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- Die cut white backing -->
    <circle cx="50" cy="50" r="42" fill="#ffffff"/>
    <circle cx="50" cy="50" r="37" fill="#facc15" stroke="#1e293b" stroke-width="4"/>
    <!-- Tightly shut squint eyes > < -->
    <path d="M30 36 L40 44 L30 52" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 36 L60 44 L70 52" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Big open laughing mouth -->
