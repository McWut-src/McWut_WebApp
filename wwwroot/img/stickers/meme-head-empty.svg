<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 112">
  <style>
    .sticker-white-border {
      filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
              drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
              drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff)
              drop-shadow(2px -2px 0 #fff) drop-shadow(-2px 2px 0 #fff)
              drop-shadow(0 4px 6px rgba(0,0,0,.22));
    }
  </style>
  <g class="sticker-white-border">
    
  <!-- Empty Thought Cloud above head -->
  <path d="M28 34 C20 34 16 26 23 22 C20 13 32 8 40 13 C46 6 60 6 65 13 C74 9 82 17 77 24 C83 28 80 34 72 34 Z"
        fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Dashed Empty Circle inside thought cloud (0 thoughts) -->
  <circle cx="50" cy="21" r="8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3 3"/>
  <!-- Trail Bubbles -->
  <circle cx="36" cy="41" r="3.5" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="42" cy="47" r="2.2" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <!-- Blank Derp Face -->
  <circle cx="50" cy="68" r="24" fill="#facc15" stroke="#111827" stroke-width="4"/>
  <!-- Wide-spaced blank eyes (o _ o) -->
  <circle cx="38" cy="65" r="3.5" fill="#111827"/>
  <circle cx="62" cy="65" r="3.5" fill="#111827"/>
  <!-- Tiny flat line mouth -->
  <line x1="45" y1="74" x2="55" y2="74" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>

  </g>
</svg>
