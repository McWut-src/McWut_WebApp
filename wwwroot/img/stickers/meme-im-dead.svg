<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 112">
  <style>
    .sticker-white-border {
      filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
              drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
              drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff)
              drop-shadow(2px -2px 0 #fff) drop-shadow(-2px 2px 0 #fff)
              drop-shadow(0 4px 6px rgba(0,0,0,.22));
    }
  </style>
  <g class="sticker-white-border">
    
  <circle cx="50" cy="52" r="38" fill="#facc15" stroke="#111827" stroke-width="4.5"/>
  <!-- Both X Eyes -->
  <path d="M28 38 L40 50 M40 38 L28 50" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 38 L72 50 M72 38 L60 50" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <!-- Flat Dead Mouth -->
  <line x1="30" y1="66" x2="70" y2="66" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <!-- Tongue Hanging Out -->
  <path d="M48 66 V82 C48 88 64 88 64 82 V66 Z" fill="#ec4899" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="56" y1="68" x2="56" y2="80" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  </g>
</svg>
