<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 112 112">
  <style>
    .sticker-white-border {
      filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
              drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
              drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff)
              drop-shadow(2px -2px 0 #fff) drop-shadow(-2px 2px 0 #fff)
              drop-shadow(0 4px 6px rgba(0,0,0,.22));
    }
  </style>
  <g class="sticker-white-border">
    
  <circle cx="50" cy="52" r="38" fill="#facc15" stroke="#111827" stroke-width="4.5"/>
  <!-- Big White Eyes -->
  <circle cx="36" cy="44" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5"/>
  <circle cx="64" cy="44" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5"/>
  <!-- Pupils Rolled All The Way Up -->
  <circle cx="36" cy="37" r="4.5" fill="#111827"/>
  <circle cx="64" cy="37" r="4.5" fill="#111827"/>
  <!-- Rosy Blush Cheeks -->
  <ellipse cx="24" cy="58" rx="6" ry="3.5" fill="#ec4899" opacity="0.75"/>
  <ellipse cx="76" cy="58" rx="6" ry="3.5" fill="#ec4899" opacity="0.75"/>
  <!-- Flat "Whatever" Mouth -->
  <line x1="38" y1="68" x2="62" y2="67" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>

  </g>
</svg>
