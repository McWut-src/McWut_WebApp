<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- White die cut border -->
    <path d="M50 8 Q50 50 92 50 Q50 50 50 92 Q50 50 8 50 Q50 50 50 8 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="50" cy="50" rx="46" ry="16" transform="rotate(-28 50 50)" fill="none" stroke="#ffffff" stroke-width="10"/>
    <!-- Orbit Ring -->
    <ellipse cx="50" cy="50" rx="44" ry="14" transform="rotate(-28 50 50)" fill="none" stroke="#06b6d4" stroke-width="5"/>
    <!-- 4-point Chrome Star -->
    <path d="M50 10 Q50 50 90 50 Q50 50 50 90 Q50 50 10 50 Q50 50 50 10 Z" fill="#ec4899" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
    <!-- Chrome Facets -->
    <path d="M50 10 Q50 50 90 50 L50 50 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M50 90 Q50 50 10 50 L50 50 Z" fill="#a855f7" opacity="0.7"/>
    <!-- Core Sparkle -->
    <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  </g>
</svg>
