<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- White die cut border -->
    <rect x="22" y="16" width="56" height="72" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Maple Syrup Tin Body -->
    <rect x="26" y="20" width="48" height="64" rx="6" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>
    <!-- Metal Lid spout -->
