<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)" transform="rotate(-35 50 50)">
    <!-- White Die-Cut Backing -->
    <rect x="34" y="6" width="32" height="88" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="8"/>
    <!-- 4 Skateboard Wheels & Axles peaking out -->
    <rect x="22" y="24" width="56" height="6" rx="3" fill="#64748b"/>
    <circle cx="22" cy="27" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <circle cx="78" cy="27" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <rect x="22" y="70" width="56" height="6" rx="3" fill="#64748b"/>
    <circle cx="22" cy="73" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <circle cx="78" cy="73" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <!-- Main Skateboard Deck -->
    <rect x="36" y="8" width="28" height="84" rx="14" fill="#1e293b" stroke="#1e293b" stroke-width="4"/>
    <!-- Grip Tape Graphic (Neon Pink & Cyan Lightning Slice) -->
    <polygon points="36,40 64,30 64,54 36,64" fill="#ec4899"/>
    <polygon points="36,46 64,36 64,48 36,58" fill="#06b6d4"/>
    <!-- Bolt heads -->
    <circle cx="43" cy="23" r="1.5" fill="#facc15"/>
    <circle cx="57" cy="23" r="1.5" fill="#facc15"/>
    <circle cx="43" cy="30" r="1.5" fill="#facc15"/>
    <circle cx="57" cy="30" r="1.5" fill="#facc15"/>
    <circle cx="43" cy="69" r="1.5" fill="#facc15"/>
    <circle cx="57" cy="69" r="1.5" fill="#facc15"/>
    <circle cx="43" cy="76" r="1.5" fill="#facc15"/>
    <circle cx="57" cy="76" r="1.5" fill="#facc15"/>
  </g>
</svg>
