    <ellipse cx="60" cy="30" rx="2" ry="1" fill="#fef08a" transform="rotate(-30 60 30)"/>
    <ellipse cx="70" cy="46" rx="2" ry="1" fill="#fef08a" transform="rotate(15 70 46)"/>
    <ellipse cx="32" cy="56" rx="2" ry="1" fill="#fef08a" transform="rotate(40 32 56)"/>
    <ellipse cx="44" cy="72" rx="2" ry="1" fill="#fef08a" transform="rotate(-20 44 72)"/>
    <ellipse cx="62" cy="68" rx="2" ry="1" fill="#fef08a" transform="rotate(10 62 68)"/>
    <ellipse cx="26" cy="42" rx="2" ry="1" fill="#fef08a" transform="rotate(-15 26 42)"/>
  </g>
</svg>
