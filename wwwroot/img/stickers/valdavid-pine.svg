<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>
  <g filter="url(#shadow)">
    <!-- White die cut backing -->
    <path d="M50 10 L88 78 H12 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <rect x="40" y="78" width="20" height="12" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
    <!-- Morning Sun behind peaks -->
    <circle cx="50" cy="34" r="14" fill="#facc15"/>
    <!-- Distant Laurentian Mountains -->
    <polygon points="20,68 44,40 68,68" fill="#94a3b8" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="44,68 64,36 84,68" fill="#64748b" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <!-- Layered Pine Trees -->
    <polygon points="50,26 64,48 56,48 70,68 30,68 44,48 36,48" fill="#15803d" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="32,44 44,62 38,62 48,78 16,78 26,62 20,62" fill="#166534" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <!-- Pine Tree Trunk -->
    <rect x="46" y="68" width="8" height="16" fill="#78350f" stroke="#1e293b" stroke-width="3"/>
  </g>
</svg>
